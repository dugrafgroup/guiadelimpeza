<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Histórico de limpezas AQF | Dugraf</title>
<style>
:root{--ink:#0E2A3B;--muted:#4F6676;--line:#D3DFE8;--bg:#EEF3F7;--card:#fff;--brand:#004D74;--ok:#1B7A3E;--okbg:#E2F3E8;--bad:#B3261E;--badbg:#FBE4E2}
@media (prefers-color-scheme:dark){:root{--ink:#EAF2F8;--muted:#9DB4C4;--line:#24445B;--bg:#0B1A24;--card:#12293A;--ok:#7FD39B;--okbg:#12362A;--bad:#FF9C94;--badbg:#3A1A1D}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Acumin Pro","Hanken Grotesk","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px}.lg{background:#fff;border-radius:8px;padding:4px 10px;display:flex}header img{height:28px;display:block}header b{font-size:16px}
main{max-width:980px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0 2px}h2{font-size:18px;margin:24px 0 10px}.sub{color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card b{display:block;font-size:17px}.card small{color:var(--muted)}.pill{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:13px}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{font:inherit;font-weight:700;height:46px;padding:0 20px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}button.p{background:var(--brand);border-color:var(--brand);color:#fff}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}
.msg{padding:28px 16px;text-align:center;color:var(--muted)}.pr{display:none}
@media print{header,.bar{display:none}body{background:#fff;color:#000}.tw{overflow:visible;border:0}table{min-width:0;font-size:11px}.card{break-inside:avoid}.pr{display:block;color:#000;margin:0 0 8px;font-size:12px}}
</style></head><body>

<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbx6qNdy_Q4hp-YYGNMh7hfd0YEXkFvDu45wr8mhEhwnODBAQ4mBCmh2UAXXPU9XmgXp/exec";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(iso){var d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
var D=null;
function fail(t){$("m").innerHTML='<div class="msg">'+esc(t)+'</div>'}
var k="";try{k=(new URLSearchParams(location.search).get("k")||"").replace(/[^A-Za-z0-9]/g,"")}catch(e){}

function draw(){
  var h='<h1>'+esc(D.empresa)+'</h1><p class="sub">Limpeza semanal das máquinas AQF. Prazo: '+D.prazo+' dias.</p>';

  h+='<h2>Histórico</h2><div class="tw"><table><tr><th>Data</th><th>Unidade</th><th>Máquina</th><th>Responsável</th><th>Passos</th><th>Duração</th><th>Observações</th></tr>'+D.registros.map(function(r){return'<tr><td>'+fd(r.data)+'</td><td>'+esc(r.unidade==="-"?"":r.unidade)+'</td><td>'+esc(r.maquina)+'</td><td>'+esc(r.responsavel)+'</td><td>'+r.passos+'/'+r.total+'</td><td>'+(r.duracao===""?"":r.duracao+' min')+'</td><td>'+esc([r.obs,r.notas].filter(Boolean).join(" | "))+'</td></tr>'}).join("")+'</table></div>';
